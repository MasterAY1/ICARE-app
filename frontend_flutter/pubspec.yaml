name: frontend_flutter
description: "ICARE Core Banking - 1:1 Streamlit Replicated Flutter Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.2
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  path_provider_android: 2.2.23

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icare_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0249A4"
  adaptive_icon_foreground: "assets/icare_adaptive_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icare_logo.jpg
    - assets/icare_logo.png
    - assets/icare_adaptive_fg.png
