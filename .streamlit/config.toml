[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true
maxUploadSize = 50
maxMessageSize = 200

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
