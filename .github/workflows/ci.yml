name: ICARE Core Banking Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    env:
      ICARE_AUTH_SECRET: ci-secret-key-for-testing-purposes-minimum-32-chars
      SUPABASE_URL: https://mock-ci-domain.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcGhwd2l4cXBlic2N0ZmtscGQiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzA0MDY3MjAwLCJleHAiOjIwMTk2NDMyMDB9.ci-mock-signature-placeholder-for-tests
      ENVIRONMENT: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Core Banking Hardened Test Suites
        run: |
          pytest tests/test_co_boundaries_and_collections.py \
                 tests/test_am_batch_summary.py \
                 tests/test_bm_eod_reconciliation.py \
                 tests/test_rbac_scope_service.py \
                 tests/test_enterprise_feature_enhancements.py \
                 tests/test_audit_reports.py \
                 tests/test_supabase_credential_configuration.py \
                 tests/test_not_paid_collection.py \
                 tests/test_session_cache.py \
                 tests/test_loan_schedule_concurrency.py \
                 tests/test_telemetry.py \
                 tests/test_mfa.py \
                 tests/test_financial_transaction_integrity.py \
                 tests/test_security_and_access_control.py \
                 -v

  frontend-check:
    name: Frontend Flutter Static Analysis & Web Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: frontend_flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify Flutter Web Release Compilation
        working-directory: frontend_flutter
        run: flutter build web --release
